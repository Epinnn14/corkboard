name: Windows app

# Builds corkboard-Setup.exe on every push to main and puts it on the GitHub
# release for the current version (desktop/package.json), so
# https://github.com/Epinnn14/corkboard/releases/latest/download/corkboard-Setup.exe
# always serves the newest one.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-app
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Build the web app
        run: |
          npm ci
          npm test
          npm run build

      - name: Package the Windows app
        working-directory: desktop
        run: |
          npm ci
          npm run dist

      - name: Read the version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish the installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: corkboard ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: desktop/release/corkboard-Setup.exe
          body: |
            **Windows:** download `corkboard-Setup.exe` and open it. corkboard installs itself, starts, and puts your
            Weekly planner on the desktop as the wallpaper. Double-click the board to edit it, press Done to put it back.

            Windows may warn that the publisher is unknown (the app isn't code-signed): *More info → Run anyway*.

            Website (no install): https://epinnn14.github.io/corkboard/
