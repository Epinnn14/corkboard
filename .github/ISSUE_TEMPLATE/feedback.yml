name: 💬 Feedback (saran & kritik)
description: What you like, what bugs you, what could be better
title: "Feedback: "
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: Honest is best, good and bad. English or Bahasa Indonesia, both are fine.
  - type: dropdown
    id: overall
    attributes:
      label: How do you like corkboard so far?
      options:
        - 😍 Love it
        - 🙂 Like it
        - 😐 It's okay
        - 🙁 Not really
    validations:
      required: true
  - type: textarea
    id: good
    attributes:
      label: What works well for you? (saran)
      placeholder: "e.g. writing times straight into the weekly planner"
  - type: textarea
    id: better
    attributes:
      label: What bugs you, or could be better? (kritik)
      placeholder: "e.g. the widget is hard to read on a dark wallpaper"
    validations:
      required: true
  - type: dropdown
    id: who
    attributes:
      label: You are… (optional)
      options:
        - A student
        - Working in an office
        - Freelancer / creator
        - Something else
